[workspace]
resolver = "2"
members = [
    "crates/example-mud",
    "crates/grim",
    "crates/grim-networking-telnet",
    "crates/grim-scene",
    "crates/grim-engine-types",
    "crates/grim-color",
    "crates/grim-text",
    "crates/grim-command",
    "crates/grim-networking",
    "crates/grim-world",
    "crates/grim-persistence",
]

[workspace.dependencies]
bevy = { version = "0.19", default-features = false, features = ["bevy_log"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
signal-hook = "0.3"