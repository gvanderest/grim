name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # Cold `cargo install cargo-llvm-cov` alone eats minutes; 10 proved too tight.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: make lint

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Coverage
        run: make coverage

  # Real-process copyover test, separate job so it gets its own timeout window
  # instead of the scraps of `check`. `-- --nocapture` streams progress live:
  # libtest captures output per-test, so a killed/hung run otherwise leaves
  # zero evidence of where it stuck.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Copyover (non-instrumented)
        run: RUSTFLAGS="-D warnings" cargo test -p example-mud --test copyover -- --nocapture
