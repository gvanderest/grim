[package]
name = "grim-scene"
version = "0.1.0"
edition = "2021"

[dependencies]
grim-engine-types = { path = "../grim-engine-types" }
grim-networking = { path = "../grim-networking" }
grim-command = { path = "../grim-command" }
grim-text = { path = "../grim-text" }
grim-color = { path = "../grim-color" }
grim-persistence = { path = "../grim-persistence" }
# Owns the race/class registry content the creation flow reads (Placement Phase 1).
grim-world = { path = "../grim-world" }
# Beings (Character/Player/InRoom/Linkdead/OutputHistory) the session reads.
grim-actor = { path = "../grim-actor" }
bevy = { workspace = true, default-features = false }
chrono = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# Test harness composes the channel plugin to exercise the full loop.
grim-channel = { path = "../grim-channel" }
